name: Deploy to droplet

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e
            cd /opt/hotelmind/hotelmind-backend
            git fetch origin main
            git reset --hard origin/main
            cd /opt/hotelmind/hotelmind-infra
            docker compose build backend consumer-worker
            docker compose up -d backend consumer-worker
            for i in $(seq 1 15); do
              docker compose exec -T backend true 2>/dev/null && break
              sleep 2
            done
            docker compose exec -T backend alembic upgrade head || {
              echo "Migration failed — rolling back"
              cd /opt/hotelmind/hotelmind-backend
              git reset --hard HEAD@{1}
              cd /opt/hotelmind/hotelmind-infra
              docker compose build backend consumer-worker
              docker compose up -d backend consumer-worker
              exit 1
            }
            healthy=0
            for i in $(seq 1 15); do
              curl -sf http://127.0.0.1:8000/health && { healthy=1; break; }
              sleep 2
            done
            if [ "$healthy" -ne 1 ]; then
              echo "Health check failed — rolling back"
              cd /opt/hotelmind/hotelmind-backend
              git reset --hard HEAD@{1}
              cd /opt/hotelmind/hotelmind-infra
              docker compose build backend consumer-worker
              docker compose up -d backend consumer-worker
              exit 1
            fi
